# Post a RepoRadar report as a pull request comment.
#
# This is the workflow most people will copy into their own project, so it is
# written to be readable and safe to fork:
#   - `pull_request` (not `pull_request_target`), so a fork's code never runs
#     with write access to this repository.
#   - The comment is updated in place instead of piling up on every push.

name: RepoRadar PR comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/repo-radar.js "$GITHUB_REPOSITORY" --format markdown --output radar.md

      - name: Create or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('radar.md', 'utf8');
            const marker = '<!-- repo-radar -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find our previous comment by its hidden marker, so each push
            // edits one comment instead of adding a new one.
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            const payload = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: payload,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: payload,
              });
            }
