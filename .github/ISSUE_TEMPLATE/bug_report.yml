name: Bug report
description: Something does not work the way it should.
title: '[Bug] '
labels: ['bug', 'needs triage']

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. A reproducible report is worth
        ten vague ones — the fields below are what we need to actually fix it.

  - type: input
    id: repository
    attributes:
      label: Repository being scanned
      description: Which repository were you scanning when this happened?
      placeholder: nodejs/node
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Paste the exact command and its full output.
      placeholder: |
        $ repo-radar nodejs/node --format html
        error: ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RepoRadar version
      description: Output of `repo-radar --version`.
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: 'v22.11.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any tokens or private data from the output above.
          required: true
