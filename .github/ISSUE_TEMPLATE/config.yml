# Routing for anything that is not a bug or a feature request.
# Keeping questions out of the issue tracker is what stops real bugs from
# getting buried.

blank_issues_enabled: false

contact_links:
  - name: Question or usage help
    url: https://github.com/mornrain-lin/repo-radar/discussions/categories/q-a
    about: Ask in Discussions — questions get answered faster there.

  - name: Show and tell
    url: https://github.com/mornrain-lin/repo-radar/discussions/categories/show-and-tell
    about: Built something with RepoRadar? Share it here.

  - name: Report a security vulnerability
    url: https://github.com/mornrain-lin/repo-radar/security/advisories/new
    about: Please report privately, never as a public issue.
